<!DOCTYPE html>
<html lang="pt-br">

<head>
    <script>
        if (localStorage.getItem('ifal_logged') !== 'true') {
            window.location.href = '/';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFAL Mentor AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-gray-100 h-screen flex overflow-hidden">

    <aside class="w-64 bg-[#184d2d] text-white flex flex-col p-4 shadow-2xl">
        <div class="flex items-center gap-3 border-b border-green-700 pb-4 mb-6">
            <div class="text-3xl text-green-400">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg">IFAL Mentor</h1>
                <p class="text-xs text-green-300">Assistente Acadêmico</p>
            </div>
        </div>

        <div class="text-xs uppercase tracking-widest text-green-300 mb-3">Histórico Real</div>
        <div id="historyList" class="flex-1 overflow-y-auto space-y-2 text-sm pr-1"></div>

        <button onclick="window.location.href='/cronograma.html'" class="bg-blue-700 hover:bg-blue-800 py-3 rounded-xl font-bold">
            Plano Semanal
        </button>

        <button onclick="clearHistory()" class="bg-yellow-600 hover:bg-yellow-700 py-3 rounded-xl font-bold mt-2">
            Limpar Histórico
        </button>

        <button onclick="logout()" class="bg-red-700 hover:bg-red-800 py-3 rounded-xl font-bold mt-2">
            Sair
        </button>
    </aside>

    <main class="flex-1 flex flex-col">
        <header class="bg-[#2e7d32] text-white p-4 shadow-md flex justify-between items-center">
            <div>
                <h2 class="font-bold text-lg">Assistente Acadêmico</h2>
                <p class="text-xs opacity-80">Bem-vindo ao IFAL Mentor AI</p>
            </div>
            <button onclick="clearChat()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm font-bold">
                Limpar Tela
            </button>
        </header>

        <div id="chatArea" class="flex-1 overflow-y-auto p-5 bg-gray-50 space-y-4"></div>

        <footer class="bg-white border-t p-4">
            <form id="mentorForm" class="max-w-5xl mx-auto space-y-3">
                <div class="grid md:grid-cols-2 gap-2">
                    <input type="text" id="curso" placeholder="Curso (Opcional)" class="border p-3 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
                    <input type="text" id="disciplina" placeholder="Disciplina (Opcional)" class="border p-3 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
                </div>

                <div class="flex gap-2">
                    <input type="text" id="question" placeholder="Digite sua dúvida..." required class="flex-1 border p-4 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
                    <label class="bg-gray-100 border p-4 rounded-xl cursor-pointer hover:bg-gray-200">
                        <i class="fas fa-paperclip"></i>
                        <input type="file" id="pdfFiles" accept=".pdf" multiple class="hidden">
                    </label>
                    <button type="submit" class="bg-[#2e7d32] hover:bg-[#184d2d] text-white px-6 rounded-xl font-bold">Enviar</button>
                </div>
                <div id="fileStatus" class="text-xs text-gray-500"></div>
            </form>
        </footer>
    </main>

    <script>
        const form = document.getElementById('mentorForm');
        const chatArea = document.getElementById('chatArea');
        const historyList = document.getElementById('historyList');
        const fileInput = document.getElementById('pdfFiles');

        // FUNÇÃO: Carrega o histórico do SQLite assim que a página abre
        async function loadHistoryFromDatabase() {
            historyList.innerHTML = '';
            try {
                const response = await fetch('/api/historico');
                const historico = await response.json();
                
                historico.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "bg-green-800 hover:bg-green-700 p-2 rounded-lg cursor-pointer truncate text-xs transition-all mb-1";
                    div.innerText = item.pergunta;
                    // Se clicar no histórico, joga a conversa antiga de volta no chat para ler
                    div.onclick = () => {
                        clearChat();
                        appendMsg('user', item.pergunta);
                        appendMsg('bot', item.resposta);
                    };
                    historyList.appendChild(div);
                });
            } catch (err) {
                console.error("Erro ao carregar histórico:", err);
            }
        }

        // Executa ao carregar a página
        loadHistoryFromDatabase();

        fileInput.addEventListener('change', () => {
            const files = fileInput.files;
            document.getElementById('fileStatus').innerText = files.length > 0 ? `${files.length} PDF(s) selecionado(s)` : '';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = document.getElementById('question').value;
            const curso = document.getElementById('curso').value;
            const disciplina = document.getElementById('disciplina').value;
            const files = fileInput.files;

            appendMsg('user', question);
            const loading = appendMsg('bot', 'Processando informações e IA...');

            const formData = new FormData();
            formData.append('question', question);
            formData.append('curso', curso);
            formData.append('disciplina', disciplina);
            for(let file of files) formData.append('files', file);

            try {
                const response = await fetch('/ask', { method: 'POST', body: formData });
                const data = await response.json();
                loading.remove();
                appendMsg('bot', data.answer);

                if(files.length > 0) {
                    appendMsg('bot', `✅ ${files.length} PDF(s) analisado(s) com sucesso.`);
                }
                
                // Recarrega a barra lateral para mostrar a nova pergunta salva no SQLite
                loadHistoryFromDatabase();

            } catch (error) {
                loading.innerText = 'Erro ao processar IA.';
            }

            document.getElementById('question').value = '';
            fileInput.value = '';
            document.getElementById('fileStatus').innerText = '';
        });

        function appendMsg(sender, text) {
            const div = document.createElement('div');
            div.className = sender === 'user'
                ? 'bg-green-100 text-green-900 p-4 rounded-xl max-w-md ml-auto shadow-sm'
                : 'bg-white p-4 border rounded-xl max-w-2xl shadow-sm text-gray-800';
            div.innerHTML = text.replace(/\n/g, '<br>');
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function clearChat() { chatArea.innerHTML = ''; }

        // Limpa o histórico tanto da tela quanto do SQLite de verdade
        async function clearHistory() {
            if(confirm("Deseja apagar todo o histórico do banco de dados?")) {
                await fetch('/api/historico', { method: 'DELETE' });
                loadHistoryFromDatabase();
                clearChat();
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }
    </script>
</body>
</html>
